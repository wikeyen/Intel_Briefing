# ABOUTME: Docker Compose for Intel Briefing — Next.js frontend + cron sidecar.
# ABOUTME: Frontend serves the app on port 8000; cron triggers the pipeline on schedule.
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8000:3000"
    environment:
      - API_KEY=${API_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    environment:
      - FRONTEND_URL=http://frontend:3000
      - CRON_SECRET=${CRON_SECRET:-}
      - FETCH_TIME=${FETCH_TIME:-07:51}
      - FETCH_TIMEZONE=${FETCH_TIMEZONE:-Asia/Shanghai}
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
