services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /intel-briefing
    ports:
      - "8080:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.ibsimple.rule=PathPrefix(`/intel-briefing`)
      - traefik.http.routers.ibsimple.entrypoints=web
      - traefik.http.routers.ibsimple.priority=300
      - traefik.http.services.ibsimple.loadbalancer.server.port=3000
    environment:
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_BASE_PATH=/intel-briefing
      - API_KEY=${API_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - DATABASE_URL=${DATABASE_URL:-file:/data/intel.db}
    volumes:
      - ./data:/data
    restart: unless-stopped
  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    environment:
      - FRONTEND_URL=http://frontend:3000
      - CRON_SECRET=${CRON_SECRET:-}
      - FETCH_TIMES=${FETCH_TIMES:-06:30,18:30}
      - FETCH_MODE=${FETCH_MODE:-fetch}
      - FETCH_TIMEZONE=${FETCH_TIMEZONE:-Asia/Bangkok}
    restart: unless-stopped
