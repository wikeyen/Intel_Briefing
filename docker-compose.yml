# ABOUTME: Docker Compose for Intel Briefing — Next.js frontend gateway + Python backend.
# ABOUTME: Frontend is the only public entry point on port 8000; backend is internal only.
services:
  backend:
    build: .
    env_file: .env
    environment:
      - DEV_PROXY_SECRET=${DEV_PROXY_SECRET:-}
    volumes:
      - ./cache:/app/cache
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8000:3000"
    environment:
      - BACKEND_URL=http://backend:8001
      - API_KEY=${API_KEY:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
