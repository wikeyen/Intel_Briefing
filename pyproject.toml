[project]
name = "intel-briefing"
version = "0.1.0"
description = "Minimal, elegant, LLM-queryable tech intelligence aggregation service"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12,<5.0",
    "defusedxml>=0.7.1",
    "google-genai>=1.0,<2.0",
    "httpx[socks]>=0.27,<1.0",
    "lxml>=5.0,<6.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["intel_briefing"]

[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=8.0",
    "pytest-cov>=7.0.0",
    "pytest-httpx>=0.36.0",
]
