name: info_aggregation

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /info-aggregation
    ports:
      - "8080:3000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.info-aggregation.rule=PathPrefix(`/info-aggregation`)
      - traefik.http.routers.info-aggregation.entrypoints=web
      - traefik.http.routers.info-aggregation.priority=300
      - traefik.http.services.info-aggregation.loadbalancer.server.port=3000
    environment:
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_BASE_PATH=/info-aggregation
      - API_KEY=${API_KEY:-}
      - CRON_SECRET=${CRON_SECRET:-}
      - DATABASE_URL=${DATABASE_URL:-file:/data/info-aggregation.db}
    volumes:
      - ./data:/data
    networks:
      default:
        aliases:
          - info-aggregation
    restart: unless-stopped
  cron:
    build:
      context: ./cron
      dockerfile: Dockerfile
    environment:
      - FRONTEND_URL=http://frontend:3000
      - CRON_SECRET=${CRON_SECRET:-}
      - FETCH_TIMES=${FETCH_TIMES:-06:30,18:30}
      - FETCH_MODE=${FETCH_MODE:-fetch}
      - FETCH_TIMEZONE=${FETCH_TIMEZONE:-Asia/Bangkok}
    restart: unless-stopped
